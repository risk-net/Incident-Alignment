name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      # 语法编译检查：确保所有源码可被 Python 正确解析
      - run: python -m compileall -q src/
