[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Incident-Alignment"
version = "0.1.0"
description = "AI risk event alignment pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "faiss-cpu>=1.7.4",
  "jsonlines>=4.0.0",
  "networkx>=3.2.0",
  "numpy>=1.24.0",
  "pandas>=2.1.0",
  "psycopg2-binary>=2.9.11",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  "sentence-transformers>=2.6.0",
  "torch>=2.1.0",
  "tqdm>=4.66.0",
]

# 项目采用"脚本式"布局：入口脚本通过 sys.path 引用 src/ 下的模块，
# 不以 Python 包的形式安装，因此不打包任何包（include = []）。
# pip install -e . 仅用于安装依赖与项目元数据。
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = []

[dependency-groups]
dev = [
  "pytest>=7.0.0",
]
