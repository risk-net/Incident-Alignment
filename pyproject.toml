[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "incident-alignment-core"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "scikit-learn>=1.2"]
[project.optional-dependencies]
test = ["pytest>=7"]
deepwide = ["torch>=2.0", "tqdm>=4.64"]
[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
incident-align = "incident_alignment.workflows.cli:main"
