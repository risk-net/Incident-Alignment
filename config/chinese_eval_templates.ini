; ============================================================================
; 中文评测链路模板（BuildEmbeddings / BuildFaissIndex / RunRecall）
;
; 中文评测域是**同一份 1,283 篇**，5 折共用同一批 cases / recall / embeddings。
; 与英文模板的差别只有路径与语料，其余参数（topk_per_route=150、fuse_mode=max）
; 必须与英文保持一致，否则跨语言对比不成立。
;
; 随包已附：data/chinese_eval/{cases.jsonl, recall_topk.jsonl, embeddings/}
; 因此这三份模板只在需要**重建**中文资产时使用。
; ============================================================================

[BuildEmbeddings]
cases_file = data/chinese_eval/cases.jsonl
output_dir = data/chinese_eval/embeddings
model_path = models/bge-m3
batch_size = 16
max_length = 2048
use_fp16 = false
embed_elements = true
skip_existing = true

[BuildFaissIndex]
embeddings_dir = data/chinese_eval/embeddings
output_dir = data/chinese_eval/faiss_index

[RunRecall]
structure_file = data/chinese_gold/gold_v2.0.2_structure.json
faiss_dir = data/chinese_eval/faiss_index
embeddings_dir = data/chinese_eval/embeddings
output_file = data/chinese_eval/recall_topk.jsonl
metrics_file = outputs/chinese/recall_metrics.json
topk_per_route = 150
topn_save = 300
fuse_mode = max
w_text = 0.5
lambda_min = 0.2
evaluate = false
