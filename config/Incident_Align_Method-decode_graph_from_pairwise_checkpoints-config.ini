[DecodeGraphFromPairwiseCheckpoints]

# Relative paths are resolved from the repository root.
PREPARED_DIR = prepared_pairwise
EMBEDDINGS_DIR = embeddings
TRAIN_OUTPUT_DIR = outputs/pairwise_train
OUTPUT_DIR = outputs/graph_decode_from_all_checkpoints

# Paths written into JSON artifacts are stored relative to this base directory.
PATH_DISPLAY_BASE = .

DEVICE = auto
BATCH_SIZE = 512
THRESHOLD_GRID_STEP = 0.02

EDGE_RULE_GRID = mutual
MERGE_STRATEGY_GRID = complete_link
K_CORE_GRID = 2,3,4
K_ATTACH_GRID = 2,3,4

OVERWRITE = false
