; ============================================================================
; DecodeGraphFromPairwiseCheckpoints — 独立图解码（dev 扫阈 + test 评测）
; 由 research_pipeline/Incident_Align_Method/pairwise_and_clustering/
;    decode_graph_from_pairwise_checkpoints.py 读取
; 段落名固定为 [DecodeGraphFromPairwiseCheckpoints]。
;
; 本脚本是**可选**的独立解码入口。常规复现走
;   train_deepwide_pairwise_5fold.py（含解码） 或
;   incident-align select-dev / evaluate-folds。
;
; 重要约束：
;   1) prepared_dir 必须是一个含 manifest.json + repeat_01/ 的**单折**目录，
;      即 data/english/folds/fold_01/train（不是上层的 folds/）。
;   2) 脚本会校验 checkpoint 元数据里的 prepared_dir 与配置一致。随包 5 个
;      checkpoint 是在历史仓库路径下训练的，其 prepared_dir 指向旧路径；
;      若直接改用本模板，需要先用当前训练脚本重训（或删除该字段后重存）。
; ============================================================================
[DecodeGraphFromPairwiseCheckpoints]

; 单折已准备的 pairwise 数据目录（含 manifest.json 与 repeat_01/）
prepared_dir = data/english/folds/fold_01/train

; 字段 embedding 目录
embeddings_dir = data/english/test/embeddings

; 训练 checkpoint 根目录（其下应有 fold_01/ 或多 epoch 文件）
train_output_dir = checkpoints/deepwide

; 解码输出目录
output_dir = outputs/english/graph_decode_5fold

; 输出里路径显示的基准目录
path_display_base = .

device = auto
batch_size = 512

; 阈值网格：0.10–0.95，步长 0.01（86 个候选点）
threshold_grid_step = 0.01

; 合并规则：mutual（双向一致取 min）或 either（任一方向取 max）
edge_rule_grid = mutual

overwrite = false
