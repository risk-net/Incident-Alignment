[Database]
host = localhost
port = 5432
database = ai_risks_db
user = postgres
password_env = DB_PASSWORD
classification_result = AIrisk_relevant_event
source_relation = ai_risk_relevant_news

[BuildDbEmbeddings]
artifacts_root = outputs/full_application_artifacts
model_path = models/bge-m3
scope_mode = full
month =
months =
month_from =
month_to =
batch_size = 32
max_length = 2048
use_fp16 = false
skip_existing = false
embed_elements = true
max_items = 10
fetch_size = 2000
index_flush_size = 50000
build_faiss = true
rebuild_faiss = false
make_month_shard_index = false
faiss_index_type = hnsw
faiss_metric = ip
faiss_threads = 8
hnsw_m = 32
ivf_nlist = 4096

[RunFullDualRecall]
artifacts_root = outputs/full_application_artifacts
output_file = outputs/full_application_artifacts/recall/full_recall_candidates.jsonl
topk_per_route = 150
topn_save = 300
fuse_mode = max
w_text = 0.5
lambda_min = 0.2
batch_size = 1000
start_idx = 0
end_idx = -1
faiss_threads = 32

[RunFullInference]
# artifacts_root 下依次产出 embeddings/ faiss/ recall/ full_inference/
artifacts_root = outputs/full_application_artifacts
embeddings_dir = outputs/full_application_artifacts/embeddings
recall_file = outputs/full_application_artifacts/recall/full_recall_candidates.jsonl
# checkpoint_path 需要替换为你训练好的 pairwise 模型路径（由 train_deepwide_pairwise.py 产生）
checkpoint_path = outputs/pairwise_train/deepwide_pairwise.pt
output_dir = outputs/full_application_artifacts/full_inference
device = auto
batch_size = 2048
pair_batch_size = 10000
topm_out = 250
# threshold：推理阶段用于写 prediction 字段；聚类阶段用于过滤候选边（run_full_clustering.py 可用 --threshold 覆盖）
threshold = 0.86
# 以下两项仅聚类脚本使用（edge_rule: mutual/either；merge_strategy: complete_link/sparse_complete_link）
edge_rule = mutual
merge_strategy = sparse_complete_link
