[Database]
host = localhost
port = 5432
database = ai_risks_db
user = postgres
password_env = DB_PASSWORD
classification_result = AIrisk_relevant_event
source_relation = v_alignment_input_v1

[BuildDbEmbeddings]
artifacts_root = outputs/full_application_artifacts
model_path = BAAI/bge-m3
scope_mode = full
month =
months =
month_from =
month_to =
batch_size = 32
max_length = 2048
use_fp16 = false
skip_existing = false
embed_elements = true
max_items = 10
fetch_size = 2000
index_flush_size = 50000
build_faiss = true
rebuild_faiss = false
make_month_shard_index = false
faiss_index_type = hnsw
faiss_metric = ip
faiss_threads = 8
hnsw_m = 32
ivf_nlist = 4096

[RunFullDualRecall]
artifacts_root = outputs/full_application_artifacts
output_file = outputs/full_application_artifacts/recall/full_recall_candidates.jsonl
topk_per_route = 150
topn_save = 300
fuse_mode = max
w_text = 0.5
lambda_min = 0.2
batch_size = 1000
start_idx = 0
end_idx = -1
faiss_threads = 32

[RunFullInference]
artifacts_root = outputs/full_application_artifacts
embeddings_dir = outputs/full_application_artifacts/embeddings
recall_file = outputs/full_application_artifacts/recall/full_recall_candidates.jsonl
checkpoint_path = outputs/your_pairwise_checkpoint.pt
output_dir = outputs/full_application_artifacts/full_inference
device = auto
batch_size = 2048
pair_batch_size = 10000
topm_out = 250
threshold = 0.84
edge_rule = mutual
merge_strategy = closure
k_core = 2
k_attach = 2
