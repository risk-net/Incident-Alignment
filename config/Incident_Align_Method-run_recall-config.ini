; ============================================================================
; RunRecall — 双通道候选召回
; 由 research_pipeline/Incident_Align_Method/candidate_generation/run_recall.py 读取
; 段落名固定为 [RunRecall]。
;
; 本包已随附召回结果（data/english/test/recall_topk.jsonl，5,998 query）。
; 只有在需要重建召回时才运行本阶段。
;
; 口径提醒（与历史训练保持一致）：
;   TOPK_PER_ROUTE=150 → 合并去重后每 query 约 168–291 个候选（平均 223）
;   下游训练脚本的 TOPM_OUT=200 会在此基础上再截断一次，不要改动这两个值的组合
;   而不重跑训练，否则 dev/test pair 集合会变化、阈值与指标都不可比。
; ============================================================================
[RunRecall]

; Gold 事件结构（只读）
structure_file = data/precomputed/eval_structure.json

; FAISS 索引目录（BuildFaissIndex 的输出）
faiss_dir = data/english/faiss_index

; 字段 Embedding 目录（BuildEmbeddings 的输出，用于取查询向量）
embeddings_dir = data/english/test/embeddings

; 输出：候选召回 JSONL（每行一个 query，含 candidates/ground_truth/meta）
output_file = data/english/test/recall_topk.jsonl

; 召回自评指标（可选）
metrics_file = outputs/english/recall_metrics.json

topk_per_route = 150
topn_save = 300
fuse_mode = max
w_text = 0.5
lambda_min = 0.2
evaluate = false
