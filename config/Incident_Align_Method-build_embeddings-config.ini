; ============================================================================
; BuildEmbeddings — 字段 Embedding 构建
; 由 research_pipeline/Incident_Align_Method/candidate_generation/build_embeddings.py 读取
; 段落名固定为 [BuildEmbeddings]，路径相对仓库根目录。
;
; 注意：本包已随附英文/中文 embedding（data/english/test/embeddings、
; data/chinese_eval/embeddings）。只有在需要**重建**时才运行本阶段，
; 重建会产生新文件，须同步更新 SHA256SUMS 与 ASSET_MANIFEST，且会改变下游结果。
; ============================================================================
[BuildEmbeddings]

; 输入：case 级语料（JSONL）。英文评测集用 data/english/test/cases.jsonl（5,998 篇）
cases_file = data/english/test/cases.jsonl

; 输出目录：每字段一组 emb_<field>.npy / valid_mask_<field>.npy + case_ids.txt
output_dir = data/english/test/embeddings

; BGE-M3 权重目录（本包不随附，需要自行准备）
model_path = models/bge-m3

batch_size = 16
max_length = 2048
use_fp16 = false
embed_elements = true
skip_existing = true
