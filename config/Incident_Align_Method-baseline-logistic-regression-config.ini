; ============================================================================
; BaselineLogisticRegression — 逻辑回归基线（英文五折 + 中文零样本）
; 由 research_pipeline/Incident_Align_Method/baselines/run_baselines.py 读取
; 段落名固定为 [BaselineLogisticRegression]。
;
; 真实训练/评测逻辑在 baselines/baseline_logistic_regression_5fold.py；
; 本 ini 只控制「驱动层」行为：跑哪些数据集/折、用哪个设备。
;
; 训练超参与口径**不在这里配置**，它们硬编码在 LR 脚本里，以保证
; 与主方法 DeepWide 严格一致（改它们会让对照失去意义）：
;   EPOCHS=8, BATCH_SIZE=512, LR=2e-4, WD=1e-4, NEG_RATIO=4, TOPM_OUT=200
;   τ 网格 0.10–0.95 / step 0.01, edge_rule=mutual, complete-link
; 若确实要改，请改脚本常量并在 docs/VALIDATION_STATUS.md 里记录。
;
; 命令行参数优先于本文件。
; ============================================================================
[BaselineLogisticRegression]

; 跑哪些评测集，逗号分隔：english（训练+评测）, chinese（零样本）
datasets = english,chinese

; 实际跑哪几折（英文五折 CV 的折号）
folds = 1,2,3,4,5

; 训练/推理设备：cpu 或 cuda:0
; 注意：本机 nvidia-smi 不可用（驱动未加载），实际只能用 cpu
device = cpu

; BLAS/torch 线程数。本模型只有 nn.Linear(17,1)，矩阵极小，
; 多线程的同步开销远大于收益（实测 121 线程只吃到 1.76 核）。
; 1 = 单线程（推荐）；0 = 不限制
threads = 1

; LR 训练轮数。
;   8  = 与主方法 DeepWide 同预算（默认，用于"同预算对照"）
;   20 = 收敛版（LR 只有 17 个参数，8 轮下 3/5 折 dev F1 仍在上升，
;        用于回答"给足轮数后 LR 是否仍不及 DeepWide"）
epochs = 8

; true = 等价于 datasets = english,chinese
all = false

; true = 不读 DeepWide 既有产物做对照表的参照列
no_reference = false

; true = 不跑任何计算，只用 outputs/benchmarks/ 下已有产物重出 comparison.csv
reuse_only = false
